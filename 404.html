<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Consulting</title>
  <meta name="description" content="The page you are looking for is not available. Return to Stackly Consulting homepage or go back to your previous page.">
  <link rel="icon" type="image/webp" href="assets/images/logo_0103.webp">
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-surface: #0e1525;
      --accent-gold: #e5a00d;
      --accent-gold-hover: #c98c0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.1);
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(229, 160, 13, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(14, 21, 37, 0.8) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .content-box {
      background: rgba(14, 21, 37, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .content-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }

    .gif-container {
      background-image: url('https://cdn.21st.dev/assets/mirror/35/354f63f88b57aceea4536df0c0cff0c3592aa46fe887ff910751fefc12f3e76c.gif');
      height: 280px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      position: relative;
      margin-bottom: 20px;
    }

    .title-404 {
      text-align: center;
      color: var(--text-main);
      font-size: 6rem;
      padding-top: 1rem;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffffff 30%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .heading-lost {
      font-size: 2rem;
      color: var(--text-main);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtext {
      margin-bottom: 32px;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .button-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      font-family: var(--font-family);
      border: none;
    }

    .btn-prev {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(229, 160, 13, 0.4);
      backdrop-filter: blur(8px);
    }

    .btn-prev:hover {
      background: rgba(229, 160, 13, 0.15);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(229, 160, 13, 0.2);
    }

    .btn-home {
      background-color: var(--accent-gold);
      color: #070b14;
      box-shadow: 0 4px 15px rgba(229, 160, 13, 0.3);
    }

    .btn-home:hover {
      background-color: var(--accent-gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(229, 160, 13, 0.45);
    }

    @media (max-width: 640px) {
      .content-box { padding: 36px 20px; }
      .title-404 { font-size: 4.5rem; }
      .gif-container { height: 200px; }
      .heading-lost { font-size: 1.5rem; }
      .button-group { flex-direction: column; width: 100%; }
      .btn-action { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="content-box">
      <div class="gif-container" aria-hidden="true">
        <h1 class="title-404">404</h1>
      </div>

      <div class="text-container">
        <h2 class="heading-lost">Looks like you're lost</h2>
        <p class="subtext">The requested resource or page is currently unavailable. You can return to your previous location or navigate back to the main homepage.</p>

        <div class="button-group">
          <button type="button" onclick="goBack()" class="btn-action btn-prev" aria-label="Go back to previous page">
            <i class="fa-solid fa-arrow-left"></i> Back to Previous Page
          </button>
          
          <a href="index.html" class="btn-action btn-home" aria-label="Go to homepage">
            <i class="fa-solid fa-house"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    function goBack() {
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
